<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eceff0">
<title>קבלת סחורה | זיסו צוות</title>
<link rel="icon" href="../img/logo.jpg">
<link rel="stylesheet" href="../fonts.css">
<style>
:root{--wall:#0f1113;--surface:#1d2024;--graphite:#22262a;--line:#3a3f45;--ink:#f2efe8;--mute:#b9b3a7;--brass:#cfae74;--brass-ink:#1a1610;--brass-soft:#2d271d;
  --red:#e07a6a;--green:#8fc9a0;--amber:#e3b86a;--display:"Bellefair","Times New Roman",serif;--body:"Assistant","Segoe UI",Arial,sans-serif}
/* Light is the look of the whole system since 19.11.2026 (home.html); it no longer follows the device. */
:root{--wall:#eceff0;--surface:#fff;--graphite:#e6eaec;--line:#cdd3d6;--ink:#1b1d1f;--mute:#555b60;--brass:#7a5c2c;--brass-ink:#fff;--brass-soft:#efe7da;--red:#b8432f;--green:#2e7d4f;--amber:#8c6200;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45}
header{position:sticky;top:0;z-index:2;background:var(--wall);border-bottom:1px solid var(--line);padding:12px 16px}
/* the colour of this area, the same as its tile on the home page */
header{border-top:4px solid #96691a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
h1,h2{font-family:var(--display);font-weight:400;margin:0}h1{font-size:26px}h2{font-size:22px;margin:24px 0 8px}
a{color:var(--brass)}
main{max-width:640px;margin:0 auto;padding:0 16px 48px}
.btn{font:inherit;color:inherit;min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.brass{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.small{min-height:40px;padding:0 14px;font-size:16px}.btn.red{color:var(--red)}
.btn[disabled]{opacity:.5;cursor:default}
.shoot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:150px;margin-top:16px;border-radius:18px;background:var(--brass);color:var(--brass-ink);font-size:24px;font-weight:700;cursor:pointer;text-align:center;padding:16px}
.shoot small{font-size:16px;font-weight:600}
.shoot svg{width:44px;height:44px}
.file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.file:focus-visible + label{outline:3px solid var(--ink);outline-offset:3px}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
select,input[type=text],input[type=date],textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;width:100%}
nav.seg{display:flex;gap:6px;margin-top:10px}
nav.seg button{flex:1;font:inherit;color:var(--ink);min-height:44px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
nav.seg button[aria-pressed=true]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
nav.seg .n{display:inline-block;min-width:24px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:14px;margin-inline-start:4px}
.f{display:block;margin:12px 0 0;font-weight:600;font-size:16px}.f small{font-weight:400;color:var(--mute)}.f>*:not(small){margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{font-size:22px;font-weight:700}
.mute{color:var(--mute);font-size:16px}.err{color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.hidden{display:none!important}
@media (pointer:coarse),(max-width:700px){.btn.small{min-height:44px;padding:0 16px}nav.seg button{min-height:48px}}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:15px;font-weight:700;white-space:nowrap}
.st.yellow{background:#f3d36b;color:#2a2205}.st.green{background:#7fcf97;color:#0d2a17}.st.orange{background:#f0a35e;color:#2b1503}.st.red{background:var(--red);color:#fff}.st.grey{background:var(--line);color:var(--ink)}
#result,#invForm{scroll-margin-top:136px}
.rc{border-inline-start:6px solid var(--line)}.rc.yellow{border-inline-start-color:#f3d36b}.rc.green{border-inline-start-color:#7fcf97}.rc.orange{border-inline-start-color:#f0a35e}.rc.red{border-inline-start-color:var(--red)}
.pages{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.pg{position:relative;width:84px;height:110px;border-radius:10px;border:1px solid var(--line);background:var(--graphite) center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;font-size:14px;font-weight:700}
.pg span{background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:0 6px;margin-bottom:4px}
.pg button{position:absolute;top:-10px;left:-10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--red);font:inherit;font-weight:700;cursor:pointer}
.ln{border-top:1px solid var(--line);padding:8px 0;font-size:16px}.ln b{font-weight:700}
.ln .bad{color:var(--red);font-weight:700}.ln .fine{color:var(--green)}.ln .odd{color:var(--amber);font-weight:700}
.ltr{direction:ltr;unicode-bidi:isolate}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--brass);font-weight:600}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
</style>
</head>
<body>
<header>
  <div class="row"><h1 class="grow">קבלת סחורה</h1><span data-zn><a class="btn small" href="home.html">בית</a></span></div>
  <nav class="seg hidden" id="seg" aria-label="מעבר בין קבלת סחורה לחשבוניות ספק">
    <button type="button" data-view="goods" aria-pressed="true">קבלת סחורה</button>
    <button type="button" data-view="inv" aria-pressed="false">חשבוניות ספק<span id="invN" class="n hidden"></span></button>
  </nav>
</header>
<main>
  <div id="needLogin" class="card hidden" role="alert">צריך להתחבר קודם. <a href="home.html">כניסה למערכת</a> ואז לחזור לכאן.</div>
  <div id="app" class="hidden">
   <div id="vGoods">
    <div id="poBox" class="card hidden"></div>
    <input class="file" type="file" id="cam" accept="image/*" capture="environment">
    <label class="shoot" for="cam" id="camLbl">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span id="camTxt">לצלם חשבונית או תעודת משלוח</span>
      <small id="camSub">מצלמים את הדף שהגיע עם הסחורה, ואני בודק אותו מול ההזמנה</small>
    </label>
    <p style="text-align:center;margin:10px 0 0"><input class="file" type="file" id="pick" accept="image/*,application/pdf" multiple><label class="btn small" for="pick">לבחור תמונה או PDF מהמכשיר</label></p>
    <div id="draft" class="card hidden">
      <b id="draftT"></b>
      <div class="pages" id="pages"></div>
      <p class="mute" style="margin:0 0 10px">יש עוד דף באותו מסמך? לצלם אותו עכשיו. מסמך אחר מצלמים בנפרד.</p>
      <button class="btn brass" id="go" style="width:100%">סיימתי לצלם, לבדוק</button>
    </div>
    <p id="msg" role="status" aria-live="polite"></p>
    <div id="result"></div>
    <h2>מסמכים אחרונים</h2>
    <div id="list"><p class="mute">טוען...</p></div>
   </div>
   <div id="vInv" class="hidden">
    <p class="mute" style="margin:14px 0 10px">חשבונית שצולמה בקבלת סחורה מגיעה לכאן לבד. בודקים את המספרים מול הדף, וההנהלה מאשרת.</p>
    <button class="btn" id="invNew" type="button" style="width:100%">להקליד חשבונית בלי צילום</button>
    <div id="invForm" class="card hidden"></div>
    <p id="invMsg" role="status" aria-live="polite"></p>
    <div id="invTodoBox" class="hidden"><h2>צולמו ועוד לא הועברו</h2><div id="invTodo"></div></div>
    <h2>ממתינות לאישור</h2>
    <div id="invWait"><p class="mute">טוען...</p></div>
    <h2>אחרונות</h2>
    <div id="invDone"></div>
   </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
(function () {
'use strict';
var SB_URL = 'https://ppnjosyraosrdephsksu.supabase.co';
var sb = supabase.createClient(SB_URL, 'sb_publishable_yjpTHQkvH5-l4v-HCcEj4w_ofAYpQmV', { auth: { persistSession: true, autoRefreshToken: true } });
var FN = SB_URL + '/functions/v1/crm-receive', BUCKET = 'goods-receipts', MAX = 4;
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { return '₪' + Number(n || 0).toLocaleString('he-IL', { maximumFractionDigits: 2 }); }
function qn(n) { return Number(n).toLocaleString('he-IL', { maximumFractionDigits: 2 }); }
function fmtTime(t) { var d = new Date(t); return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' }) + ' ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }); }
var session = null, pages = [], busy = false, lastId = null, openPos = null, timer = null;
var poId = Number(new URLSearchParams(location.search).get('po')) || null;

var ST = { reading: ['grey', 'קורא את המסמך'], ok: ['green', 'תקין'], gap: ['orange', 'יש פער'], check: ['yellow', 'לבדוק'], failed: ['red', 'הקריאה נכשלה'] };
var FLAGS = { sum_mismatch: 'סכום השורות לא מתאים לסה"כ שכתוב במסמך.', no_allocation: 'חשבונית מעל ₪5,000 בלי מספר הקצאה. לבדוק מול הספק לפני שמעבירים להנהלת החשבונות.',
  supplier_unknown: 'לא זיהיתי את הספק מתוך הרשימה שלנו.', hard_to_read: 'חלק מהשורות קשות לקריאה. כדאי לעבור עליהן מול הדף.' };
function badge(r) {
  var s = ST[r.status] || ['grey', r.status];
  if (r.status === 'ok' && r.result && r.result.basis === 'none') s = ['grey', 'נשמר'];
  return s;
}
function lineHtml(l, basis) {
  var bits = [], name = '<b>' + esc(l.desc || l.sku || 'פריט') + '</b>' + (l.sku && l.desc ? ' <span class="mute ltr">' + esc(l.sku) + '</span>' : '');
  if (basis === 'order') {
    if (l.qty === 'missing') bits.push('<span class="bad">לא הגיע (הוזמנו ' + qn(l.ordered) + ')</span>');
    else if (l.qty === 'short') bits.push('<span class="bad">הגיעו ' + qn(l.got) + ' מתוך ' + qn(l.ordered) + '</span>');
    else if (l.qty === 'over') bits.push('<span class="odd">הגיעו ' + qn(l.got) + ', הוזמנו ' + qn(l.ordered) + '</span>');
    else if (l.qty === 'ok') bits.push('<span class="fine">הגיעו ' + qn(l.got) + ', כמו שהוזמן</span>');
    else bits.push('<span class="odd">הכמות לא ברורה במסמך (הוזמנו ' + qn(l.ordered) + ')</span>');
  } else if (l.got != null) bits.push('כמות ' + qn(l.got));
  var agreed = basis === 'order' ? l.po_price : l.list_price, word = basis === 'order' ? 'סוכם' : 'במחירון';
  if (l.price === 'up') bits.push('<span class="bad">מחיר ' + money(l.doc_price) + ', ' + word + ' ' + money(agreed) + '</span>');
  else if (l.price === 'down') bits.push('<span class="odd">מחיר ' + money(l.doc_price) + ', נמוך מ' + (basis === 'order' ? 'מה שסוכם' : 'המחירון') + ' (' + money(agreed) + ')</span>');
  else if (l.price === 'ok') bits.push('<span class="fine">מחיר ' + money(l.doc_price) + ', כמו ש' + (basis === 'order' ? 'סוכם' : 'במחירון') + '</span>');
  else if (l.doc_price != null) bits.push('מחיר ' + money(l.doc_price) + (l.price === 'unknown' ? ' (אין במחירון להשוואה)' : ''));
  if (l.sure === false) bits.push('<span class="odd">קריאה לא בטוחה</span>');
  return '<div class="ln">' + name + '<br>' + bits.join(' · ') + '</div>';
}
function detailHtml(r) {
  var res = r.result || {}, lines = res.lines || [], extras = res.extras || [], flags = (res.flags || []).filter(function (f) { return FLAGS[f]; });
  var h = flags.map(function (f) { return '<p class="err" style="margin:6px 0">' + FLAGS[f] + '</p>'; }).join('');
  h += lines.map(function (l) { return lineHtml(l, res.basis); }).join('');
  h += extras.map(function (x) { return '<div class="ln"><b>' + esc(x.desc || x.sku || 'פריט') + '</b><br><span class="bad">הגיע בלי שהוזמן' + (x.got != null ? ' (כמות ' + qn(x.got) + ')' : '') + '</span>' + (x.doc_price != null ? ' · מחיר ' + money(x.doc_price) : '') + '</div>'; }).join('');
  return h;
}
function cardHtml(r, open) {
  var b = badge(r), res = r.result || {}, det = detailHtml(r);
  var head = '<div class="row"><b class="grow">' + esc(r.supplier_name || 'ספק לא מזוהה') + (res.po_no ? ' · ' + esc(res.po_no) : '') + '</b><span class="st ' + b[0] + '">' + (r.status === 'reading' ? '<span class="spin" aria-hidden="true"></span> ' : '') + b[1] + '</span></div>';
  var h = '<div class="card rc ' + b[0] + '" data-rc="' + r.id + '">' + head +
    '<p style="margin:6px 0">' + esc(r.summary || (r.status === 'reading' ? 'קורא את המסמך, זה לוקח עד דקה...' : '')) + '</p>' +
    (res.lead_days != null ? '<p class="mute" style="margin:0">הגיע ' + qn(res.lead_days) + ' ימים אחרי שההזמנה נשלחה.</p>' : '') +
    '<p class="mute" style="margin:0">' + esc(r.rc_no || '') + ' · ' + fmtTime(r.created_at) + (r.by_name ? ' · צילם/ה ' + esc(r.by_name) : '') + '</p>' +
    (det ? '<details' + (open ? ' open' : '') + '><summary>הפירוט שורה שורה</summary>' + det + '</details>' : '');
  var acts = '<button class="btn small" data-act="view" data-id="' + r.id + '">לראות את הצילום</button>';
  var stuck = r.status === 'reading' && Date.now() - new Date(r.updated_at || r.created_at).getTime() > 3 * 60e3;
  if (r.status === 'failed' || stuck) acts += '<button class="btn small brass" data-act="retry" data-id="' + r.id + '">לנסות לקרוא שוב</button>';
  if (r.status !== 'reading' && r.status !== 'failed' && !r.po_id && !r.dup_of && r.supplier_id) acts += '<button class="btn small" data-act="link" data-id="' + r.id + '" data-sup="' + esc(r.supplier_id) + '">לשייך להזמנה</button>';
  return h + '<div class="row" style="margin-top:8px">' + acts + '</div><div data-slot="' + r.id + '"></div><div data-islot="' + r.id + '"></div></div>';
}

function call(body) {
  return fetch(FN, { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + session.access_token }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'תקלה בשרת' }; }); });
}
function loadList() {
  return sb.from('crm_receipts').select('*').order('created_at', { ascending: false }).limit(20).then(function (r) {
    var rows = r.data || [];
    $('list').innerHTML = rows.length ? rows.filter(function (x) { return x.id !== lastId; }).map(function (x) { return cardHtml(x, false); }).join('') || '<p class="mute">אין מסמכים קודמים.</p>' : '<p class="mute">עוד לא צולמו מסמכים.</p>';
    clearTimeout(timer);
    if (rows.some(function (x) { return x.status === 'reading'; })) timer = setTimeout(loadList, 15000);
  });
}

/* ---------- taking the photos ---------- */
function uid() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12); }
var EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/heic': 'heic', 'image/heif': 'heif', 'application/pdf': 'pdf' };
function shrink(file) {
  return new Promise(function (ok, bad) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var k = Math.min(1, 2200 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { URL.revokeObjectURL(url); b ? ok(b) : bad(new Error('blob')); }, 'image/jpeg', 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); bad(new Error('img')); };
    img.src = url;
  });
}
function say(t, cls) { $('msg').textContent = t || ''; $('msg').className = cls || ''; }
function drawDraft() {
  $('draft').classList.toggle('hidden', !pages.length);
  $('draftT').textContent = pages.length === 1 ? 'צולם דף אחד' : 'צולמו ' + pages.length + ' דפים';
  $('pages').innerHTML = pages.map(function (p, i) { return '<div class="pg"' + (p.thumb ? ' style="background-image:url(' + p.thumb + ')"' : '') + '><span>' + (p.pdf ? 'PDF' : 'דף ' + (i + 1)) + '</span><button type="button" data-rm="' + i + '" aria-label="להסיר דף ' + (i + 1) + '">✕</button></div>'; }).join('');
  $('camTxt').textContent = pages.length ? 'לצלם עוד דף' : 'לצלם חשבונית או תעודת משלוח';
  $('camSub').classList.toggle('hidden', !!pages.length);
  $('camLbl').style.minHeight = pages.length ? '84px' : '';
  var full = pages.length >= MAX; $('cam').disabled = $('pick').disabled = full || busy; $('camLbl').style.opacity = full ? .5 : 1;
}
function addFiles(list) {
  var files = Array.prototype.slice.call(list || []); if (!files.length || busy) return;
  say('');
  files.forEach(function (f) {
    if (pages.length >= MAX) { say('אפשר עד ' + MAX + ' דפים למסמך.', 'err'); return; }
    var pdf = f.type === 'application/pdf';
    if (!pdf && f.type.indexOf('image/') !== 0) { say('אפשר לצלם תמונה או לבחור PDF.', 'err'); return; }
    if (f.size > 24 * 1024 * 1024) { say('הקובץ גדול מדי.', 'err'); return; }
    if (pdf && pages.length) { say('PDF שולחים לבד, בלי דפים נוספים.', 'err'); return; }
    if (!pdf && pages.some(function (p) { return p.pdf; })) { say('PDF שולחים לבד, בלי דפים נוספים.', 'err'); return; }
    pages.push({ file: f, pdf: pdf, thumb: pdf ? '' : URL.createObjectURL(f) });
  });
  drawDraft();
}
$('cam').addEventListener('change', function () { addFiles(this.files); this.value = ''; });
$('pick').addEventListener('change', function () { addFiles(this.files); this.value = ''; });
$('pages').addEventListener('click', function (e) { var b = e.target.closest('[data-rm]'); if (!b || busy) return; pages.splice(Number(b.dataset.rm), 1); drawDraft(); });

$('go').addEventListener('click', function () {
  if (busy || !pages.length) return;
  busy = true; $('go').disabled = true; drawDraft();
  say('מעלה את הצילום...');
  var d = new Date(), month = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  var ups = pages.map(function (p) {
    var id = uid(), ext = EXT[p.file.type] || 'jpg', orig = 'orig/' + month + '/' + id + '.' + ext;
    /* the untouched original is always kept; a lighter copy is what gets read */
    var keep = sb.storage.from(BUCKET).upload(orig, p.file, { contentType: p.file.type || 'image/jpeg', upsert: false }).then(function (r) { if (r.error) throw r.error; });
    if (p.pdf) return keep.then(function () { return { orig: orig, read: orig, mime: 'application/pdf', size: p.file.size }; });

      return '<option value="' + o.id + '" data-no="' + esc(o.po_no) + '"' + (Number(pick) === o.id ? ' selected' : '') + '>' + esc(o.po_no) + ' · ' + fmtTime(o.created_at) + ' · ' + money(o.total_cost) + '</option>'; }).join('');
  });
}
/* typing the amount before VAT fills the VAT and the total; typing only the total splits it. A typed VAT is never overwritten */
function calc(src) {
  var net = numOr($('fNet').value), vat = numOr($('fVat').value), total = numOr($('fTotal').value);
  if (src === 'fVat') form.vatTyped = $('fVat').value !== '';
  if (src === 'fNet' && net != null) { if (!form.vatTyped) { vat = r2(net * VAT); $('fVat').value = vat; } $('fTotal').value = total = r2(net + (vat || 0)); }
  if (src === 'fVat' && net != null && vat != null) $('fTotal').value = total = r2(net + vat);
  if (src === 'fTotal' && total != null && $('fNet').value === '') { net = r2(total / (1 + VAT)); vat = r2(total - net); $('fNet').value = net; $('fVat').value = vat; }
  var ok = net != null && total != null && Math.abs(net + (vat || 0) - total) < 0.05, el = $('fSum');
  el.className = net == null || total == null || ok ? 'mute' : 'err';
  el.textContent = net == null || total == null ? '' : ok ? 'הסכומים מסתדרים.' : 'הסכומים לא מסתדרים: ' + money(net) + ' ועוד ' + money(vat || 0) + ' הם ' + money(r2(net + (vat || 0))) + ', ולא ' + money(total) + '.';
  if (ok && allocNeeded($('fType').value, $('fDate').value, net) && !$('fAlloc').value.trim()) { el.className = 'err'; el.textContent = 'בחשבונית בסכום כזה חייב להיות מספר הקצאה. אפשר לשמור בלעדיו, אבל אי אפשר יהיה לאשר.'; }
}
function saveForm() {
  if (invBusy || !form) return;
  var po = $('fPo').selectedOptions[0], f = { id: form.id, receipt_id: form.receipt_id, file_path: form.file_path, supplier_id: $('fSup').value, doc_type: $('fType').value, inv_no: $('fNo').value.trim(),
    inv_date: $('fDate').value, due_date: $('fDue').value, net: numOr($('fNet').value), vat: numOr($('fVat').value) || 0, total: numOr($('fTotal').value), allocation_no: $('fAlloc').value.trim(),
    po_id: po && po.value ? Number(po.value) : null, po_no: po && po.value ? po.dataset.no : null, note: $('fNote').value.trim() };
  var bad = !f.supplier_id ? 'לבחור ספק.' : !f.inv_no ? 'להקליד את מספר החשבונית.' : !f.inv_date ? 'לבחור את תאריך החשבונית.' : f.inv_date > today() ? 'תאריך החשבונית בעתיד. לבדוק מול הדף.'
    : f.net == null || f.total == null ? 'להקליד את הסכום לפני מע"מ ואת הסכום הכולל.' : !sumsOk(f) ? 'הסכומים לא מסתדרים: לפני מע"מ ועוד מע"מ צריך לצאת הסכום הכולל.'
    : f.due_date && f.due_date < f.inv_date ? 'מועד התשלום מוקדם מתאריך החשבונית.' : '';
  if (bad) { $('fErr').textContent = bad; return; }
  invBusy = true; $('fErr').textContent = ''; $('fSave').disabled = true; $('fSave').innerHTML = '<span class="spin" aria-hidden="true"></span> שומר...';
  var file = $('fFile') && $('fFile').files[0], up = Promise.resolve();
  if (file) {
    if (file.size > 24 * 1024 * 1024 || !(file.type === 'application/pdf' || file.type.indexOf('image/') === 0)) { invBusy = false; $('fSave').disabled = false; $('fSave').textContent = 'לשמור ולהעביר לאישור'; $('fErr').textContent = 'אפשר לצרף תמונה או PDF עד 24MB.'; return; }
    var d = new Date(), path = 'orig/' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '/' + uid() + '.' + (EXT[file.type] || 'jpg');
    up = sb.storage.from(BUCKET).upload(path, file, { contentType: file.type, upsert: false }).then(function (r) { if (r.error) throw new Error('upload'); f.file_path = path; });
  }
  up.then(function () { return sb.rpc('acc_supinv_save', { p: payload(f) }); }).then(function (x) {
    invBusy = false;
    if (x.error) { $('fSave').disabled = false; $('fSave').textContent = 'לשמור ולהעביר לאישור'; $('fErr').textContent = rpcErr(x.error); return; }
    closeForm(); invSay('נשמר. החשבונית ממתינה לאישור.'); loadInv();
  }, function (e) {
    invBusy = false; if (!$('fSave')) return;
    $('fSave').disabled = false; $('fSave').textContent = 'לשמור ולהעביר לאישור'; $('fErr').textContent = e && e.message === 'upload' ? 'הצילום לא עלה. לבדוק חיבור לאינטרנט ולנסות שוב.' : 'לא נשמר. לבדוק חיבור לאינטרנט ולנסות שוב.';
  });
}
function signed(paths) {
  return Promise.all(paths.map(function (p) { return sb.storage.from(BUCKET).createSignedUrl(p, 600); })).then(function (rs) {
    return rs.filter(function (x) { return x.data && x.data.signedUrl; }).map(function (x, i) { return '<a class="btn small" target="_blank" rel="noopener" href="' + esc(x.data.signedUrl) + '">דף ' + (i + 1) + '</a>'; }).join('');
  });
}
function rcPaths(id) { return sb.from('crm_receipts').select('files').eq('id', id).maybeSingle().then(function (r) { return ((r.data && r.data.files) || []).map(function (f) { return f.orig; }); }); }
function onInv(e) {
  var b = e.target.closest('[data-iact]'); if (!b) return;
  var a = b.dataset.iact, id = Number(b.dataset.id), v = invById[id], slot = id ? document.querySelector('[data-vslot="' + id + '"]') : null;
  if (a === 'go') { show('inv'); return; }
  if (a === 'fill') { var r = rcById[Number(b.dataset.rc)]; if (!r) return; show('inv'); openForm(fromReceipt(r)); return; }
  if (a === 'fview') { b.disabled = true; rcPaths(Number(b.dataset.rc)).then(signed).then(function (h) { b.disabled = false; $('fPics').innerHTML = h || '<span class="err">לא הצלחתי לפתוח את הצילום</span>'; }); return; }
  if (!v || !slot) return;
  if (a === 'view') {
    b.disabled = true;
    (v.receipt_id ? rcPaths(v.receipt_id) : Promise.resolve(v.file_path ? [v.file_path] : [])).then(signed).then(function (h) {
      b.disabled = false; slot.innerHTML = '<div class="row" style="margin-top:8px">' + (h || '<span class="mute">לחשבונית הזו לא צורף צילום.</span>') + '</div>';
    });
    return;
  }
  if (a === 'edit') { openForm({ id: v.id, receipt_id: v.receipt_id, file_path: v.file_path, supplier_id: v.supplier_id, doc_type: v.doc_type, inv_no: v.inv_no, inv_date: v.inv_date, due_date: v.due_date, net: v.net, vat: v.vat, total: v.total, allocation_no: v.allocation_no, po_id: v.po_id, note: v.note, vatTyped: true }); return; }
  if (a === 'ok') { slot.innerHTML = '<p style="margin:10px 0 6px">לאשר את החשבונית על ' + money(v.total) + '? אחרי האישור אי אפשר לתקן אותה, רק לדחות.</p><div class="row"><button class="btn small brass" type="button" data-iact="ok2" data-id="' + id + '">כן, לאשר</button><button class="btn small" type="button" data-iact="x" data-id="' + id + '">ביטול</button></div>'; return; }
  if (a === 'no') { slot.innerHTML = '<label class="f">למה דוחים את החשבונית?<input type="text" id="why' + id + '" maxlength="200" autocomplete="off"></label><div class="row" style="margin-top:8px"><button class="btn small red" type="button" data-iact="no2" data-id="' + id + '">לדחות</button><button class="btn small" type="button" data-iact="x" data-id="' + id + '">ביטול</button></div><p class="err" id="whyE' + id + '" role="alert" style="margin:6px 0 0"></p>'; $('why' + id).focus(); return; }
  if (a === 'x') { slot.innerHTML = ''; return; }
  if (a === 're') {
    if (invBusy) return; invBusy = true; b.disabled = true;
    sb.rpc('acc_supinv_reopen', { p_id: id }).then(function (x) {
      invBusy = false;
      if (x.error) { b.disabled = false; slot.innerHTML = '<p class="err" role="alert" style="margin:6px 0 0">' + rpcErr(x.error) + '</p>'; return; }
      invSay('החשבונית נפתחה מחדש וממתינה לאישור. אפשר לתקן אותה.'); loadInv();
    }, function () { invBusy = false; b.disabled = false; });
    return;
  }
  if (a === 'ok2' || a === 'no2') {
    var why = a === 'no2' ? $('why' + id).value.trim() : '';
    if (a === 'no2' && why.length < 3) { $('whyE' + id).textContent = 'לכתוב בקצרה את הסיבה.'; return; }
    if (invBusy) return; invBusy = true; b.disabled = true;
    (a === 'ok2' ? sb.rpc('acc_supinv_approve', { p_id: id }) : sb.rpc('acc_supinv_reject', { p_id: id, p_reason: why })).then(function (x) {
      invBusy = false;
      if (x.error) { b.disabled = false; slot.insertAdjacentHTML('beforeend', '<p class="err" role="alert" style="margin:6px 0 0">' + rpcErr(x.error) + '</p>'); return; }
      invSay(a === 'ok2' ? 'החשבונית אושרה.' : 'החשבונית נדחתה.'); loadInv();
    }, function () { invBusy = false; b.disabled = false; });
  }
}
function show(view) {
  var inv = view === 'inv';
  $('vGoods').classList.toggle('hidden', inv); $('vInv').classList.toggle('hidden', !inv);
  Array.prototype.forEach.call($('seg').querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', String((b.dataset.view === 'inv') === inv)); });
  try { history.replaceState(null, '', location.pathname + location.search + (inv ? '#invoices' : '')); } catch (e) {}
  if (inv) loadInv(); else window.scrollTo(0, 0);
}
$('seg').addEventListener('click', function (e) { var b = e.target.closest('[data-view]'); if (b) show(b.dataset.view); });
$('invNew').addEventListener('click', function () { openForm({ doc_type: 'invoice', inv_date: today() }); });
$('vInv').addEventListener('click', onInv); $('result').addEventListener('click', onInv);
function startInv() {
  $('seg').classList.remove('hidden');
  return Promise.all([sb.from('sp_suppliers').select('id,name').order('name'), sb.from('crm_staff').select('email,name'), sb.rpc('acc_can_approve')]).then(function (rs) {
    sups = rs[0].data || []; sups.forEach(function (s) { supName[s.id] = s.name; });
    (rs[1].data || []).forEach(function (s) { staffName[String(s.email).toLowerCase()] = s.name; });
    canApprove = rs[2].data === true;
    if (location.hash === '#invoices') show('inv'); else loadInv();
  });
}

function loadPo() {
  if (!poId) return;
  sb.from('crm_po').select('id,po_no,supplier_name,lines,receive_state,receive_summary,customer_name').eq('id', poId).maybeSingle().then(function (r) {
    var o = r.data; if (!o) { poId = null; return; }
    $('poBox').innerHTML = '<b>מצלמים סחורה של הזמנה ' + esc(o.po_no) + ' · ' + esc(o.supplier_name) + '</b>' + (o.customer_name ? '<br><span class="mute">עבור ' + esc(o.customer_name) + '</span>' : '') +
      '<br><span class="mute">' + ((o.lines || []).length) + ' שורות בהזמנה' + (o.receive_summary ? ' · ' + esc(o.receive_summary) : '') + '</span>';
    $('poBox').classList.remove('hidden');
  });
}

sb.auth.getSession().then(function (r) {
  session = r.data.session;
  if (!session) { $('needLogin').classList.remove('hidden'); return; }
  sb.auth.onAuthStateChange(function (_e, s) { if (s) session = s; });
  $('app').classList.remove('hidden'); loadPo(); loadList(); drawDraft(); startInv();
});
})();
</script>
