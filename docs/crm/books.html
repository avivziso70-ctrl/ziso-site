<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1113">
<title>הנהלת חשבונות | זיסו</title>
<link rel="icon" href="../img/logo.jpg">
<link rel="stylesheet" href="../fonts.css">
<style>
:root{--wall:#0f1113;--surface:#1d2024;--graphite:#22262a;--line:#3a3f45;--ink:#f2efe8;--mute:#b9b3a7;--brass:#cfae74;--brass-ink:#1a1610;--brass-soft:#2d271d;
  --red:#e07a6a;--green:#8fc9a0;--amber:#e3b86a;--display:"Bellefair","Times New Roman",serif;--body:"Assistant","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme: light){:root{--wall:#f3f2ef;--surface:#fff;--graphite:#ecebe7;--line:#d2cec5;--ink:#1e1b17;--mute:#5f5d58;--brass:#7a5c2c;--brass-ink:#fff;--brass-soft:#efe7da;--red:#b8432f;--green:#2e7d4f;--amber:#8c6200}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
h1{font-size:24px}h2{font-size:26px;margin:0 0 4px}h3{font-size:20px;margin:28px 0 8px}
p{margin:0 0 12px}.mute{color:var(--mute)}.small{font-size:14px}
a{color:var(--brass)}
header{position:sticky;top:0;z-index:5;background:var(--wall);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center}
header .grow{flex:1}
.ro{font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--mute);white-space:nowrap}
.btn{font:inherit;color:inherit;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.btn.brass{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,nav button:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.shell{display:flex;min-height:calc(100vh - 65px)}
nav{flex:0 0 212px;border-inline-end:1px solid var(--line);padding:12px 8px;position:sticky;top:65px;align-self:flex-start;max-height:calc(100vh - 65px);overflow:auto}
nav button{display:block;width:100%;text-align:start;font:inherit;color:var(--ink);background:none;border:0;border-radius:10px;padding:9px 12px;cursor:pointer}
nav button:hover{background:var(--graphite)}
nav button[aria-current="page"]{background:var(--brass-soft);color:var(--brass);font-weight:700}
nav .sep{height:1px;background:var(--line);margin:8px 6px}
main{flex:1;min-width:0;padding:20px 24px 64px;max-width:1280px}
main:focus{outline:none}
.lead{color:var(--mute);max-width:70ch;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0 8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .k{font-size:14px;color:var(--mute)}.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.tile .s{font-size:13px;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:12px 0}
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 10px}
input[type=search]{min-width:200px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;min-height:36px;padding:0 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brass-soft);border-color:var(--brass);color:var(--brass);font-weight:700}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--graphite);font-weight:700;font-size:14px;white-space:nowrap;z-index:1}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
td.d{white-space:nowrap;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--graphite)}
tfoot td{font-weight:700;background:var(--graphite);position:sticky;bottom:0}
.neg{color:var(--red)}.pos{color:var(--green)}
.tag{display:inline-block;font-size:13px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);white-space:nowrap}
.tag.ok{color:var(--green);border-color:var(--green)}.tag.warn{color:var(--amber);border-color:var(--amber)}.tag.bad{color:var(--red);border-color:var(--red)}
.check{list-style:none;margin:8px 0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.check li{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.check li:last-child{border-bottom:0}.check .t{flex:1}.check .t b{display:block}
.note{border:1px solid var(--line);border-inline-start:3px solid var(--amber);border-radius:10px;padding:10px 14px;background:var(--surface);margin:12px 0;max-width:80ch}
.empty{padding:28px 16px;text-align:center;color:var(--mute)}
.note.practice{border-color:var(--amber);border-inline-start-width:6px;background:var(--brass-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.two .tw{margin-top:6px}
@media (max-width:800px){.two{grid-template-columns:1fr}}
form table input{min-height:38px}
@media (max-width:640px){#jl .ja,#rl .ja{width:92px!important}#jl .jm,#rl .jm{min-width:84px!important}#jl .jd,#jl .jc,#rl .jd,#rl .jc{width:78px!important}#jl th,#jl td,#rl th,#rl td{padding:6px 4px}}
.card{max-width:420px;margin:8vh auto;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.card label{display:block;margin:12px 0 4px;font-weight:600}.card input{width:100%;min-height:48px}
.card .btn{width:100%;margin-top:16px;min-height:48px}
.err{color:var(--red);min-height:1.4em;margin-top:8px}
.back{margin-bottom:10px}
.lnk{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.lnk:focus-visible{outline:2px solid currentColor;outline-offset:2px}
dialog#dlg{width:min(860px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:16px}
dialog#dlg::backdrop{background:rgba(0,0,0,.45)}
#navSel{display:none}
@media (max-width:1023px){
  nav{display:none}
  body.in #navSel{display:block;flex:1 1 170px;min-width:150px;max-width:280px;font-weight:700}
  body.in header h1,#who,body.in header .grow{display:none}
  .card{margin:6vh 12px}
  header{gap:8px;padding:10px 12px}
  main{padding:14px 12px 56px}
  h2{font-size:23px}
  .tile .v{font-size:20px}
  table{font-size:14px}th,td{padding:7px 8px}
}
#stmt{display:none}
@media print{body.pstmt>*:not(#stmt){display:none!important}body.pstmt #stmt{display:block;color:#000;background:#fff;font-size:12px;padding:0 4mm}#stmt h1,#stmt h2{font-family:inherit}#stmt h1{font-size:18px;margin:0 0 2px}#stmt h2{font-size:15px;margin:14px 0 6px}#stmt table{width:100%;border-collapse:collapse;margin-top:8px}#stmt th,#stmt td{border-bottom:1px solid #999;padding:4px 6px;text-align:right}#stmt .n{text-align:left;direction:ltr;white-space:nowrap}#stmt tfoot td{font-weight:700;border-top:2px solid #000}#stmt .ft{margin-top:14px;font-size:11px;color:#333}}
@media print{header,nav,.bar,.btn{display:none!important}.tw{max-height:none;overflow:visible;border:0}body{background:#fff;color:#000}}
</style>
</head>
<body>
<header>
  <span data-zn></span>
  <h1>הנהלת חשבונות</h1>
  <select id="navSel" aria-label="מסך"></select>
  <span class="ro" id="roTag">קריאה בלבד</span>
  <span class="grow"></span>
  <span class="mute small hidden" id="who"></span>
  <button class="btn small hidden" id="outBtn" type="button">יציאה</button>
</header>

<section id="login" class="card hidden" aria-labelledby="loginH">
  <h2 id="loginH">כניסה</h2>
  <p class="mute">עמדת העבודה של הנהלת החשבונות של זיסו קרמיקה. הכניסה למורשים בלבד, וכל כניסה נרשמת.</p>
  <form id="loginF">
    <label for="lEmail">אימייל</label><input id="lEmail" name="email" type="email" autocomplete="username" required dir="ltr">
    <label for="lPw">סיסמה</label><input id="lPw" name="password" type="password" autocomplete="current-password" required dir="ltr">
    <button class="btn brass" type="submit">כניסה</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<section id="newPw" class="card hidden" aria-labelledby="pwH">
  <h2 id="pwH">בחירת סיסמה חדשה</h2>
  <p class="mute">זו הכניסה הראשונה. צריך להחליף את הסיסמה הזמנית בסיסמה שרק את/ה יודע/ת. לפחות 10 תווים.</p>
  <form id="pwF">
    <label for="p1">סיסמה חדשה</label><input id="p1" type="password" autocomplete="new-password" minlength="10" required dir="ltr">
    <label for="p2">שוב, לאימות</label><input id="p2" type="password" autocomplete="new-password" minlength="10" required dir="ltr">
    <button class="btn brass" type="submit">שמירה וכניסה</button>
    <div class="err" id="pwErr" role="alert"></div>
  </form>
</section>

<div class="shell hidden" id="app">
  <nav id="nav" aria-label="מסכים"></nav>
  <main id="main" tabindex="-1"></main>
<dialog id="dlg" aria-label="פרטי מסמך"></dialog>
</div>
<div id="stmt" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
(function () {
'use strict';
var SB_URL = 'https://ppnjosyraosrdephsksu.supabase.co';
var sb = supabase.createClient(SB_URL, 'sb_publishable_yjpTHQkvH5-l4v-HCcEj4w_ofAYpQmV', { auth: { persistSession: true, autoRefreshToken: true } });
var $ = function (id) { return document.getElementById(id); };
var main = $('main'), me = null, cur = 'overview', session = null;
try { history.scrollRestoration = 'manual'; } catch (e) {}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function num(n, dec) { return Number(n || 0).toLocaleString('he-IL', { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 }); }
function money(n, plain) {
  if (n == null || n === '') return '';
  var v = Number(n), s = (v < 0 ? '-' : '') + '₪' + num(Math.abs(v), Math.abs(v) < 100000 && v % 1 !== 0);
  return plain ? s : '<span class="' + (v < 0 ? 'neg' : '') + '">' + s + '</span>';
}
function day(d) { if (!d) return ''; var p = String(d).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0].slice(2); }
function when(t) { if (!t) return ''; var d = new Date(t); return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' }) + ' ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }); }
function month(m) { var p = String(m).split('-'); return p[1] + '/' + p[0]; }
function iso(d) { return d.toISOString().slice(0, 10); }
function daysAgo(n) { var d = new Date(); d.setDate(d.getDate() - n); return iso(d); }

var KIND = { supplier_cheque: 'שיק לספק', receipts: 'תקבול', card_settlement: 'סליקת אשראי', loan: 'החזר הלוואה', loan_in: 'קבלת הלוואה', owners: 'משיכת בעלים',
  owners_in: 'הפקדת בעלים', payroll: 'שכר', tax: 'מסים ומוסדות', fees: 'עמלות', interest: 'ריבית', services: 'שירותים', other: 'אחר', returned: 'שיק חוזר',
  discount_in: 'ניכיון שיקים', card_bill: 'חיוב כרטיס אשראי', card_purchase: 'רכישה בכרטיס החברה' };
var KINDA = { asset: 'נכסים', liability: 'התחייבויות', equity: 'הון', income: 'הכנסות', cogs: 'עלות המכירות', expense: 'הוצאות' };
var SCREENS = [
  ['overview', 'סקירה וסגירת חודש'], ['find', 'חיפוש כללי'], ['bank', 'התאמת בנק'], ['match', 'בנק מול מסמכים'], ['cards', 'התאמת כרטיסי אשראי'], ['cardtx', 'סליקה: עסקה מול קבלה'], null,
  ['customers', 'לקוחות'], ['collect', 'גבייה'], ['suppliers', 'ספקים'], ['payplan', 'תשלומים לספקים'], ['cheques', 'שיקים לפירעון'], ['docs', 'חשבוניות וקבלות'], ['supinv', 'חשבוניות ספק'], null,
  ['vat', 'מע"מ ומוסדות'], ['owners', 'חו"ז בעלים'], ['missing', 'תנועות שדורשות מסמך'], null,
  ['journal', 'יומן ומאזן בוחן'], ['accounts', 'אינדקס חשבונות'], null, ['sandbox', 'תרגול (לא משפיע על הספרים)'], ['readers', 'הרשאות ורישום גישה', true]
];

/* ---------- table helper ---------- */
// cols: [{k, t, f: 'money'|'date'|'num'|function(row), n: numeric align, sum: true}]
function cell(c, r) {
  var v = r[c.k];
  if (typeof c.f === 'function') return c.f(r);
  if (c.f === 'money') return money(v);
  if (c.f === 'date') return day(v);
  if (c.f === 'num') return v == null ? '' : num(v);
  return esc(v);
}
function table(cols, rows, opt) {
  opt = opt || {};
  if (!rows || !rows.length) return '<div class="tw"><div class="empty">' + esc(opt.empty || 'אין נתונים להצגה') + '</div></div>';
  var h = '<div class="tw"><table><thead><tr>' + cols.map(function (c) { return '<th scope="col"' + (c.n ? ' class="n"' : '') + '>' + esc(c.t) + '</th>'; }).join('') + '</tr></thead><tbody>';
  rows.forEach(function (r, i) {
    h += '<tr' + (opt.click ? ' class="click" tabindex="0" data-i="' + i + '"' : '') + '>' + cols.map(function (c) {
      return '<td class="' + (c.n ? 'n' : c.f === 'date' ? 'd' : '') + '">' + cell(c, r) + '</td>';
    }).join('') + '</tr>';
  });
  h += '</tbody>';
  if (cols.some(function (c) { return c.sum; })) {
    h += '<tfoot><tr>' + cols.map(function (c, i) {
      if (!c.sum) return '<td>' + (i === 0 ? 'סה"כ (' + num(rows.length) + ')' : '') + '</td>';
      return '<td class="n">' + money(rows.reduce(function (a, r) { return a + Number(r[c.k] || 0); }, 0)) + '</td>';
    }).join('') + '</tr></tfoot>';
  }
  return h + '</table></div>';
}
function csv(name, cols, rows) {
  var q = function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var out = [cols.map(function (c) { return q(c.t); }).join(',')].concat(rows.map(function (r) { return cols.map(function (c) { return q(typeof c.f === 'function' ? (c.raw ? c.raw(r) : r[c.k]) : r[c.k]); }).join(','); }));
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + out.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = name + '-' + iso(new Date()) + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}
function tile(k, v, s) { return '<div class="tile"><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>'; }
function head(title, lead) { return '<h2>' + esc(title) + '</h2><p class="lead">' + lead + '</p>'; }
function filt(rows, q, keys) {
  q = (q || '').trim().toLowerCase(); if (!q) return rows;
  return rows.filter(function (r) { return keys.some(function (k) { return String(r[k] == null ? '' : r[k]).toLowerCase().indexOf(q) >= 0; }); });
}
function get(screen, args) {
  return sb.rpc('books_get', { p_screen: screen, p_args: args || {} }).then(function (r) {
    if (r.error) throw r.error; return r.data;
  });
}
function busy(t) { main.innerHTML = '<div class="empty" role="status">' + esc(t || 'טוען…') + '</div>'; }
function fail(e) {
  var no = e && (e.code === '42501' || /no access/.test(e.message || ''));
  main.innerHTML = '<div class="note" role="alert">' + (no ? 'אין לחשבון הזה הרשאה לעמדה. פנו לאביב.' : 'הנתונים לא נטענו. בדקו את החיבור לאינטרנט ונסו שוב.') +
    '</div><button class="btn" type="button" id="retry">ניסיון נוסף</button>';
  $('retry').onclick = function () { show(cur); };
}
function onRow(rows, fn) {
  main.querySelectorAll('tr.click').forEach(function (tr) {
    var go = function () { fn(rows[Number(tr.dataset.i)]); };
    tr.onclick = go; tr.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
}

/* ---------- screens ---------- */
var V = {};

V.overview = function () {
  return get('overview').then(function (d) {
    var u = d.unmatched || {}, cm = d.card_month || {}, lag = d.typed_through && d.bank_last_tx ? Math.round((new Date(d.bank_last_tx) - new Date(d.typed_through)) / 864e5) : null;
    var li = function (st, t, s, go) { return '<li><span class="tag ' + st[0] + '">' + st[1] + '</span><span class="t"><b>' + t + '</b><span class="mute small">' + s + '</span></span>' +
      (go ? '<button class="btn small" type="button" data-go="' + go + '">פתיחה</button>' : '') + '</li>'; };
    var OK = ['ok', 'תקין'], W = ['warn', 'לטיפול'], B = ['bad', 'פתוח'];
    var h = head('סקירה וסגירת חודש', 'מצב הספרים ברגע זה. כל המספרים נמשכים חי ממסד הנתונים: הבנק דרך חיבור הבנק, המסמכים והיתרות מפריוריטי.');
    h += '<div class="tiles">' +
      tile('יתרת עו"ש בבנק', money(d.bank && d.bank.balance), d.bank ? 'נכון ל־' + day(d.bank.as_of) + ' · מסגרת ' + money(d.bank.credit_limit, 1) : '') +
      tile('לקוחות, יתרה כוללת', money(d.customers.total), num(d.customers.n) + ' כרטיסים עם יתרה') +
      tile('ספקים, חוב פתוח', money(d.suppliers.open), 'מזה בפיגור ' + money(d.suppliers.late, 1)) +
      tile('שיקים עתידיים לספקים', money(d.cheques.sum), num(d.cheques.n) + ' שיקים שטרם הגיע מועדם') + '</div>';
    h += '<h3>רשימת סגירה</h3><ul class="check">' +
      li(lag != null && lag <= 7 ? OK : B, 'דפי בנק הוקלדו עד ' + day(d.typed_through), 'התנועה האחרונה בבנק: ' + day(d.bank_last_tx) + (lag > 7 ? '. פער של ' + lag + ' ימים' : ''), 'bank') +

/* ---------- supplier statement comparison: pasted text against our open documents. Runs in the browser only. ---------- */
function compareStatement(text, open, cheques) {
  var key = function (v) { return String(v == null ? '' : v).replace(/\D/g, '').replace(/^0+/, ''); };
  var theirs = {}, order = [];
  String(text || '').split(/\r?\n/).forEach(function (line) {
    var tk = line.replace(/[₪"]/g, ' ').split(/[\t;|]+|\s{2,}|\s(?=[-\d])/).map(function (x) { return x.trim(); }).filter(Boolean)
      .filter(function (x) { return !/^\d{1,4}[.\/-]\d{1,2}[.\/-]\d{2,4}$/.test(x); });
    var doc = null, di = -1, amt = null;
    tk.forEach(function (x, i) { if (doc == null && /\d{3,}/.test(x) && !/[.,]\d{1,2}$/.test(x)) { doc = x; di = i; } });
    for (var i = tk.length - 1; i > di && amt == null; i--) { var v = tk[i].replace(/,/g, ''); if (/^-?\(?\d+(\.\d+)?\)?-?$/.test(v)) amt = (/^\(|-/.test(v) ? -1 : 1) * Number(v.replace(/[()\-]/g, '')); }
    var k = key(doc); if (!k || amt == null) return;
    if (!theirs[k]) { theirs[k] = { no: doc, amt: 0 }; order.push(k); } theirs[k].amt += amt;
  });
  if (!order.length) return [];
  var ours = {}, paid = {};
  (open || []).forEach(function (r) { var k = key(r.sup_doc); if (!k) return; ours[k] = ours[k] || { no: r.sup_doc, amt: 0 }; ours[k].amt += Number(r.doc_amount != null ? r.doc_amount : r.open || 0); });
  (cheques || []).forEach(function (c) { String(c.inv_list || '').split(/[,\s]+/).forEach(function (n) { var k = key(n); if (k) paid[k] = c; }); });
  var out = [];
  order.forEach(function (k) {
    var t = theirs[k], o = ours[k], c = paid[k];
    if (o) { var df = Math.abs(t.amt) - Math.abs(o.amt); out.push(Math.abs(df) <= 1 ? { st: 'תואם', cls: 'ok', no: t.no, theirs: t.amt, ours: o.amt, diff: null, note: '' } : { st: 'הפרש בסכום', cls: 'bad', no: t.no, theirs: t.amt, ours: o.amt, diff: df, note: '' }); }
    else if (c) out.push({ st: 'שולם בשיק', cls: 'warn', no: t.no, theirs: t.amt, ours: null, diff: null, note: 'שיק ' + c.check_no + ' לפירעון ' + day(c.check_due) + (c.cleared ? ', נפרע' : ', טרם נפרע') });
    else out.push({ st: 'חסר אצלנו', cls: 'bad', no: t.no, theirs: t.amt, ours: null, diff: t.amt, note: 'לא נמצא במסמכים הפתוחים ולא בשיקים' });
  });
  Object.keys(ours).forEach(function (k) { if (!theirs[k]) out.push({ st: 'רק אצלנו', cls: 'warn', no: ours[k].no, theirs: null, ours: ours[k].amt, diff: -ours[k].amt, note: 'פתוח אצלנו ולא מופיע בכרטסת הספק' }); });
  var rank = { bad: 0, warn: 1, ok: 2 };
  return out.sort(function (a, b) { return rank[a.cls] - rank[b.cls]; });
}

    var draw = function (d) {
      var h = '<h2>תרגול</h2><div class="note practice" role="note"><b>מצב תרגול.</b> כל מה שנרשם במסך הזה נשמר בנפרד, רק אצלך. הוא לא נכנס לספרים, לדוחות, למע"מ, ל־CRM, לפריוריטי או לסאמיט, ואף אחד אחר לא רואה אותו. אפשר לנסות, לטעות ולמחוק.</div>';
      h += '<h3>פקודת יומן לתרגול</h3><p class="mute small">בהנהלת חשבונות כפולה כל פקודה מאוזנת: סך החובה שווה לסך הזכות. בחרו חשבון מהאינדקס ורשמו סכום בחובה או בזכות.</p>' +
        '<form id="jf"><div class="bar"><label class="f">תאריך<input type="date" id="jDate" value="' + iso(new Date()) + '"></label><label class="f" style="flex:1;min-width:200px">פרטים<input id="jMemo" maxlength="300" placeholder="לדוגמה: חשבונית ספק לתרגול"></label></div>' +
        '<div class="tw"><table id="jl"><thead><tr><th scope="col">חשבון</th><th scope="col">פרטי שורה</th><th scope="col" class="n">חובה</th><th scope="col" class="n">זכות</th></tr></thead><tbody></tbody>' +
        '<tfoot><tr><td colspan="2" id="jState"></td><td class="n" id="jD"></td><td class="n" id="jC"></td></tr></tfoot></table></div>' +
        '<datalist id="accL">' + d.accounts.map(function (a) { return '<option value="' + esc(a.code) + '">' + esc(a.name) + '</option>'; }).join('') + '</datalist>' +
        '<div class="bar"><button class="btn small" type="button" id="jAdd">שורה נוספת</button><button class="btn brass small" type="submit">שמירת פקודת תרגול</button></div><div class="err" id="jErr" role="alert"></div></form>';
      h += '<h3>פקודות התרגול שלי</h3>';
      if (!d.journal.length) h += table([], [], { empty: 'עוד לא נרשמו פקודות תרגול' });
      d.journal.forEach(function (j) {
        h += '<p style="margin:14px 0 4px"><span class="tag warn">תרגול</span> <b>' + day(j.date) + '</b> · ' + esc(j.memo || 'בלי פרטים') + ' <button class="btn small" type="button" data-jdel="' + j.id + '">מחיקה</button></p>' +
          table([{ k: 'a', t: 'חשבון' }, { k: 'n', t: 'שם', f: function (r) { var a = d.accounts.filter(function (x) { return x.code === r.a; })[0]; return esc(a ? a.name : ''); } }, { k: 'm', t: 'פרטים' },
            { k: 'd', t: 'חובה', f: function (r) { return Number(r.d) ? money(r.d) : ''; }, n: 1 }, { k: 'c', t: 'זכות', f: function (r) { return Number(r.c) ? money(r.c) : ''; }, n: 1 }], j.lines);
      });
      h += '<h3>מאזן בוחן של התרגול</h3>' + table([{ k: 'code', t: 'חשבון' }, { k: 'name', t: 'שם' }, { k: 'debit', t: 'חובה', f: 'money', n: 1, sum: 1 }, { k: 'credit', t: 'זכות', f: 'money', n: 1, sum: 1 },
        { k: 'b', t: 'יתרה', n: 1, f: function (r) { return money(r.debit - r.credit); } }], d.tb, { empty: 'המאזן יתמלא אחרי הפקודה הראשונה' });
      h += '<h3>התאמת בנק לתרגול</h3><p class="mute small">בחרו תנועה אחת מהבנק ותנועה אחת מהספרים וסמנו אותן כזוג. הסימון נשמר כאן בלבד, ומסך התאמת הבנק האמיתי לא משתנה.</p>' +
        '<div class="two"><div><b>בבנק, לא הוקלד</b><div id="mA"></div></div><div><b>הוקלד, לא נמצא בבנק</b><div id="mB"></div></div></div>' +
        '<div class="bar"><label class="f" style="flex:1;min-width:200px">הערה<input id="mNote" maxlength="300" placeholder="למה אלה אותה תנועה"></label><button class="btn brass small" type="button" id="mAdd">סימון כזוג (תרגול)</button></div><div class="err" id="mErr" role="alert"></div>' +
        '<h3>זוגות שסימנתי בתרגול</h3>' + table([{ k: 'b1', t: 'בבנק', f: function (r) { return day(r.bank.bank_date) + ' · ' + esc(r.bank.descr || '') + ' · ' + money(r.bank.amount); } },
          { k: 'b2', t: 'בספרים', f: function (r) { return day(r.books.books_date) + ' · ' + esc(r.books.descr || '') + ' · ' + money(r.books.amount); } }, { k: 'note', t: 'הערה' },
          { k: 'x', t: '', f: function (r) { return '<button class="btn small" type="button" data-mdel="' + r.id + '">מחיקה</button>'; } }], d.matches, { empty: 'עוד לא סומנו זוגות' });
      h += '<h3>איפוס</h3><p class="mute small">מוחק את כל פקודות התרגול והזוגות שלך ומתחיל מחדש. הנתונים האמיתיים לא מושפעים.</p><button class="btn" type="button" id="tReset">איפוס כל התרגול שלי</button>';
      main.innerHTML = h;

      var tb = $('jl').tBodies[0];
      var addLine = function () {
        var tr = document.createElement('tr');
        tr.innerHTML = '<td><input list="accL" class="ja" aria-label="מספר חשבון" placeholder="מספר חשבון" dir="ltr" style="width:130px"></td><td><input class="jm" aria-label="פרטי שורה" maxlength="200" style="width:100%;min-width:140px"></td>' +
          '<td class="n"><input class="jd" aria-label="חובה" inputmode="decimal" dir="ltr" style="width:110px"></td><td class="n"><input class="jc" aria-label="זכות" inputmode="decimal" dir="ltr" style="width:110px"></td>';
        tb.appendChild(tr);
      };
      var val = function (el) { var v = parseFloat(String(el.value).replace(/,/g, '')); return isFinite(v) ? v : 0; };
      var lines = function () { return [].map.call(tb.rows, function (tr) { return { a: tr.querySelector('.ja').value.trim(), m: tr.querySelector('.jm').value, d: val(tr.querySelector('.jd')), c: val(tr.querySelector('.jc')) }; }); };
      var totals = function () {
        var l = lines(), dd = l.reduce(function (s, x) { return s + x.d; }, 0), cc = l.reduce(function (s, x) { return s + x.c; }, 0), ok = dd > 0 && Math.abs(dd - cc) < 0.005;
        $('jD').innerHTML = money(dd); $('jC').innerHTML = money(cc);
        $('jState').innerHTML = ok ? '<span class="tag ok">מאוזן</span>' : dd || cc ? '<span class="tag warn">לא מאוזן, הפרש ' + money(Math.abs(dd - cc), 1) + '</span>' : '';
      };
      addLine(); addLine(); totals();
      tb.addEventListener('input', function () { $('jErr').textContent = ''; totals(); });
      $('jAdd').onclick = addLine;
      var after = function (p, errEl) { return p.then(function (nd) { draw(nd); }).catch(function (e) { $(errEl).textContent = tryMsg(e); }); };
      $('jf').onsubmit = function (e) { e.preventDefault(); $('jErr').textContent = ''; after(tryDo('je_add', { date: $('jDate').value, memo: $('jMemo').value, lines: lines() }), 'jErr'); };
      main.querySelectorAll('[data-jdel]').forEach(function (b) { b.onclick = function () { b.disabled = true; after(tryDo('je_del', { id: b.dataset.jdel }), 'jErr'); }; });
      main.querySelectorAll('[data-mdel]').forEach(function (b) { b.onclick = function () { b.disabled = true; after(tryDo('match_del', { id: b.dataset.mdel }), 'mErr'); }; });

      var pickList = function (el, rows, dk, name) {
        $(el).innerHTML = rows.length ? '<div class="tw" style="max-height:300px"><table><tbody>' + rows.map(function (r, i) {
          return '<tr><td><input type="radio" name="' + name + '" value="' + i + '" id="' + name + i + '"></td><td class="d"><label for="' + name + i + '">' + day(r[dk]) + '</label></td><td>' + esc(r.descr || '') + '</td><td class="n">' + money(r.amount) + '</td></tr>'; }).join('') + '</tbody></table></div>'
          : '<div class="tw"><div class="empty">אין תנועות פתוחות בצד הזה</div></div>';
      };
      pickList('mA', bank, 'bank_date', 'pa'); pickList('mB', books, 'books_date', 'pb'); pickA = pickB = -1;
      $('mA').onchange = function (e) { pickA = Number(e.target.value); }; $('mB').onchange = function (e) { pickB = Number(e.target.value); };
      $('mAdd').onclick = function () {
        $('mErr').textContent = '';
        if (pickA < 0 || pickB < 0) { $('mErr').textContent = TERR.need_both; return; }
        after(tryDo('match_add', { bank: bank[pickA], books: books[pickB], note: $('mNote').value }), 'mErr');
      };
      var armed = false;
      $('tReset').onclick = function () {
        if (!armed) { armed = true; this.textContent = 'לחצו שוב כדי למחוק את כל התרגול'; this.classList.add('brass'); return; }
        this.disabled = true; after(tryDo('reset'), 'mErr');
      };
    };
    draw(d);
  });
};

/* ---------- shell ---------- */
function buildNav() {
  var nav = $('nav'), sel = $('navSel'); nav.innerHTML = ''; sel.innerHTML = '';
  SCREENS.forEach(function (s) {
    if (!s) { var d = document.createElement('div'); d.className = 'sep'; nav.appendChild(d); return; }
    if (s[2] && !me.owner) return;
    var b = document.createElement('button'); b.type = 'button'; b.textContent = s[1]; b.dataset.s = s[0]; b.onclick = function () { show(s[0]); }; nav.appendChild(b);
    var o = document.createElement('option'); o.value = s[0]; o.textContent = s[1]; sel.appendChild(o);
  });
  sel.onchange = function () { show(sel.value); };
}
function show(name, sub) {
  if (!V[name]) name = 'overview';
  cur = name; $('navSel').value = name;
  $('nav').querySelectorAll('button').forEach(function (b) { if (b.dataset.s === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  busy();
  V[name](sub).then(function () { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }).catch(fail);
}
function start() {
  $('login').classList.add('hidden'); $('newPw').classList.add('hidden');
  if (session.user && session.user.user_metadata && session.user.user_metadata.must_change_pw) { $('newPw').classList.remove('hidden'); $('p1').focus(); return; }
  get('me').then(function (m) {
    me = m; $('who').textContent = m.name || m.email; $('who').classList.remove('hidden'); $('outBtn').classList.remove('hidden');
    $('roTag').textContent = m.owner ? 'בעלים' : 'קריאה בלבד';
    document.body.classList.add('in'); $('app').classList.remove('hidden'); buildNav(); show((location.hash || '').slice(1) || 'overview'); idle();
  }).catch(function () {
    sb.auth.signOut().then(function () { session = null; $('login').classList.remove('hidden'); $('loginErr').textContent = 'אין לחשבון הזה הרשאה לעמדה. פנו לאביב.'; });
  });
}
function out() { sb.auth.signOut().then(function () { location.reload(); }); }
var idleT;
function idle() { // sign out after 30 minutes without use
  var reset = function () { clearTimeout(idleT); idleT = setTimeout(out, 30 * 60 * 1000); };
  ['click', 'keydown', 'touchstart', 'scroll'].forEach(function (ev) { window.addEventListener(ev, reset, { passive: true }); }); reset();
}
window.addEventListener('hashchange', function () { var n = (location.hash || '').slice(1); if (me && n && n !== cur && V[n]) show(n); });
$('outBtn').onclick = out;
$('loginF').onsubmit = function (e) {
  e.preventDefault(); var btn = e.target.querySelector('button'); btn.disabled = true; $('loginErr').textContent = '';
  sb.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPw').value }).then(function (r) {
    btn.disabled = false;
    if (r.error) { $('loginErr').textContent = 'האימייל או הסיסמה לא נכונים. נסו שוב.'; return; }
    session = r.data.session; start();
  });
};
$('pwF').onsubmit = function (e) {
  e.preventDefault(); $('pwErr').textContent = '';
  if ($('p1').value !== $('p2').value) { $('pwErr').textContent = 'שתי הסיסמאות לא זהות.'; return; }
  var btn = e.target.querySelector('button'); btn.disabled = true;
  sb.auth.updateUser({ password: $('p1').value, data: { must_change_pw: false, pw_changed_at: new Date().toISOString() } }).then(function (r) {
    btn.disabled = false;
    if (r.error) { $('pwErr').textContent = 'הסיסמה לא נשמרה. בחרו סיסמה אחרת, באורך 10 תווים לפחות.'; return; }
    session.user = r.data.user; start();
  });
};
sb.auth.getSession().then(function (r) {
  session = r.data.session;
  sb.auth.onAuthStateChange(function (_e, s) { if (s) session = s; });
  if (!session) { $('login').classList.remove('hidden'); return; }
  start();
});
})();
</script>
