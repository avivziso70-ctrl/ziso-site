<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>חיבור וואטסאפ - זיסו קרמיקה</title><meta name="robots" content="noindex">
<style>body{font-family:system-ui,Arial,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#222;background:#fff;line-height:1.6}
button{background:#1877f2;color:#fff;border:0;border-radius:6px;padding:12px 22px;font-size:17px;cursor:pointer}#log{margin-top:20px;white-space:pre-wrap;font-size:14px;color:#444}</style></head>
<body>
<h1>חיבור הוואטסאפ העסקי של זיסו קרמיקה</h1>
<p>הדף מחבר את המספר העסקי למערכת של העסק, והוואטסאפ בטלפון ממשיך לעבוד כרגיל. בסוף התהליך תתבקשו לסרוק קוד באפליקציית WhatsApp Business ולאשר שיתוף היסטוריית שיחות.</p>
<button id="go">התחברות עם פייסבוק</button>
<div id="log"></div>
<script>
// Embedded Signup with coexistence (WhatsApp Business app onboarding). CONFIG_ID comes from
// Meta app → Facebook Login for Business → Configurations (variation: WhatsApp Embedded Signup).
var APP_ID = '1742263687036823', CONFIG_ID = 'REPLACE_WITH_CONFIG_ID';
var ONBOARD = 'https://ppnjosyraosrdephsksu.supabase.co/functions/v1/wa-onboard';
var signup = {}, code = null, log = function (t) { document.getElementById('log').textContent += t + '\n'; };
window.fbAsyncInit = function () { FB.init({ appId: APP_ID, autoLogAppEvents: true, xfbml: false, version: 'v23.0' }); };
window.addEventListener('message', function (e) {
  if (!/facebook\.com$/.test(new URL(e.origin).hostname)) return;
  try { var d = JSON.parse(e.data); } catch (_) { return; }
  if (d.type !== 'WA_EMBEDDED_SIGNUP') return;
  if (d.event === 'FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING' || d.event === 'FINISH') { signup = d.data; finish(); }
  else log('התהליך הופסק: ' + (d.event || '') + ' ' + JSON.stringify(d.data || {}));
});
function finish() {
  if (!code || !signup.waba_id) return;
  log('מסיים חיבור...');
  fetch(ONBOARD, { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ code: code, waba_id: signup.waba_id, phone_number_id: signup.phone_number_id }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { log(j.ok ? 'החיבור הושלם. השיחות יתחילו להיקלט, וההיסטוריה תגיע בשעות הקרובות.' : 'שגיאה: ' + JSON.stringify(j)); })
    .catch(function (e) { log('שגיאת רשת: ' + e); });
}
document.getElementById('go').onclick = function () {
  FB.login(function (r) { if (r.authResponse && r.authResponse.code) { code = r.authResponse.code; finish(); } else log('ההתחברות בוטלה.'); },
    { config_id: CONFIG_ID, response_type: 'code', override_default_response_type: true,
      extras: { setup: {}, featureType: 'whatsapp_business_app_onboarding', sessionInfoVersion: '3' } });
};
</script>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
</body></html>
