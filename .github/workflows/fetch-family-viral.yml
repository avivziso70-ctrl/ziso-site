name: Fetch family viral drafts
# Higgsfield renders live on a CDN the build container cannot reach; this job downloads them
# unchanged into social/family-viral/raw/ and commits them so they can be copied to the project files.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['social/family-viral/sources.json', '.github/workflows/fetch-family-viral.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -euo pipefail
          mkdir -p social/family-viral/raw
          jq -r 'to_entries[] | "\(.key) \(.value)"' social/family-viral/sources.json | while read -r name url; do
            out="social/family-viral/raw/$name"
            if [ -s "$out" ]; then echo "keep $out"; continue; fi
            echo "fetch $name"; curl -sS -f -L -o "$out" "$url"; ls -la "$out"
          done
      - name: Commit
        run: |
          git config user.name "ziso-site bot"; git config user.email "actions@users.noreply.github.com"
          git add social/family-viral/raw
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Add family viral draft renders"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
