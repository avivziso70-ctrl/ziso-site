name: Fetch and compress site videos
# Generated clips live on a CDN the build container cannot reach; this job downloads them,
# compresses them for the web (muted H.264 + poster JPEG) and commits them to src/img/video/.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', main]
    paths: ['src/video/sources.json', '.github/workflows/fetch-video.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and encode
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq >/dev/null
          mkdir -p src/img/video
          jq -r 'to_entries[] | "\(.key) \(.value.url) \(.value.width)"' src/video/sources.json | while read -r name url width; do
            out="src/img/video/$name.mp4"
            if [ -s "$out" ]; then echo "keep $out"; continue; fi
            echo "fetch $name"; curl -sS -f -L -o raw.mp4 "$url"
            ffmpeg -v error -y -i raw.mp4 -an -vf "scale=$width:-2:flags=lanczos,fps=24" -c:v libx264 -preset slow -crf 27 -pix_fmt yuv420p -profile:v high -movflags +faststart "$out"
            ffmpeg -v error -y -ss 0.1 -i "$out" -frames:v 1 -q:v 4 "src/img/video/$name.jpg"
            ls -la "$out" "src/img/video/$name.jpg"
          done
          rm -f raw.mp4
      - name: Commit
        run: |
          git config user.name "ziso-site bot"; git config user.email "actions@users.noreply.github.com"
          git add src/img/video
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Add compressed site videos and posters"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
